<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Galáxia do Amor ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tela inicial -->

    <div id="inicio">

        <div class="inicio-coracao">❤️</div>

        <h1>Para o meu amor</h1>

        <p>
            Preparei um pequeno universo
            especialmente para você.
        </p>

        <button onclick="entrar()">
            ✨ Entrar na galáxia ✨
        </button>

    </div>


    <!-- GALÁXIA -->

    <main id="galaxia">

        <!-- Área onde o JavaScript desenhará
             a galáxia -->

        <canvas id="canvas"></canvas>


        <!-- Título -->

        <div class="titulo">

            <h1>Te Amo</h1>

            <div class="coracao">
                ♥
            </div>

        </div>


        <!-- Frases que ficarão ao redor -->

        <div class="frases">

            <span class="frase f1">
                ERES MI TODO ❤️
            </span>

            <span class="frase f2">
                MI UNIVERSO ✨
            </span>

            <span class="frase f3">
                TE ADORO 💗
            </span>

            <span class="frase f4">
                CONTIGO TODO 💕
            </span>

            <span class="frase f5">
                ERES MAGIA ✨
            </span>

            <span class="frase f6">
                MI PERSONA FAVORITA ❤️
            </span>

            <span class="frase f7">
                PARA EL AMOR DE MI VIDA 💖
            </span>

        </div>


        <!-- Mensagem -->

        <div class="mensagem">

            <p>
                Você é a pessoa que faz
                meu universo brilhar.
            </p>

        </div>


        <!-- Instrução -->

        <div id="instrucao">

            👆 Toque e arraste para girar

        </div>


        <!-- Botão -->

        <button
            class="botao-coracao"
            onclick="explodirCoracoes()">

            ❤️

        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
